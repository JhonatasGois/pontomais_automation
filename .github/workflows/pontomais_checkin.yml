name: Pontomais Daily Check-in

on:
  # O agendamento nativo do GitHub Actions (schedule/cron) não é confiável:
  # roda em fila compartilhada e pode atrasar de 1 a 6+ horas.
  # Por isso este workflow agora é disparado externamente via workflow_dispatch,
  # chamado por um serviço de cron externo (ex: cron-job.org) no horário exato.
  workflow_dispatch:

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install playwright python-telegram-bot python-dotenv
        playwright install chromium --with-deps

    - name: Run Pontomais Automation Script
      env:
        PYTHONUNBUFFERED: "1"
        PONTOMAIS_LOGIN: ${{ secrets.PONTOMAIS_LOGIN }}
        PONTOMAIS_PASSWORD: ${{ secrets.PONTOMAIS_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -u pontomais_automation.py
