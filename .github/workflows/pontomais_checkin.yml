name: Pontomais Daily Check-in

on:
  schedule:
    - cron: '55 10 * * *'  # 07:55 UTC = espera até 08:00 BRT
    - cron: '55 15 * * *'  # 12:55 UTC = espera até 13:00 BRT
    - cron: '55 16 * * *'  # 13:55 UTC = espera até 14:00 BRT
    - cron: '50 20 * * *'  # 17:48 UTC = espera até 17:48 BRT
  workflow_dispatch:

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install playwright python-telegram-bot python-dotenv
        playwright install chromium --with-deps

    - name: Run Pontomais Automation Script
      env:
        PYTHONUNBUFFERED: "1"
        CRON_SCHEDULE: ${{ github.event.schedule }}
        PONTOMAIS_LOGIN: ${{ secrets.PONTOMAIS_LOGIN }}
        PONTOMAIS_PASSWORD: ${{ secrets.PONTOMAIS_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -u pontomais_automation.py