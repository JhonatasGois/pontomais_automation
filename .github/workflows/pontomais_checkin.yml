name: Pontomais Daily Check-in

on:
  schedule:
    # 07:58 BRT (10:58 UTC) → dispara às 10:20 UTC (38min de margem pro delay do GitHub)
    - cron: '20 10 * * *'
    # 13:00 BRT (16:00 UTC) → dispara às 15:20 UTC
    - cron: '20 15 * * *'
    # 14:00 BRT (17:00 UTC) → dispara às 16:20 UTC
    - cron: '20 16 * * *'
    # 17:55 BRT (20:55 UTC) → dispara às 20:15 UTC
    - cron: '15 20 * * *'
  workflow_dispatch:

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install playwright python-telegram-bot python-dotenv
        playwright install chromium --with-deps

    - name: Run Pontomais Automation Script
      env:
        PYTHONUNBUFFERED: "1"
        CRON_SCHEDULE: ${{ github.event.schedule }}
        PONTOMAIS_LOGIN: ${{ secrets.PONTOMAIS_LOGIN }}
        PONTOMAIS_PASSWORD: ${{ secrets.PONTOMAIS_PASSWORD }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -u pontomais_automation.py